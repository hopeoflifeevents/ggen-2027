<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GGEN 2027 — Access Pass Scanner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="icon" type="image/png" href="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f525.png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- HTML5-QRCODE Scanner Engine -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      background-color: #060913;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .font-bebas { font-family: 'Bebas Neue', sans-serif; }
    .font-mono-code { font-family: 'Space Mono', monospace; }

    /* Laser scan animation */
    @keyframes scanLine {
      0% { top: 6%; opacity: 0.8; }
      50% { top: 88%; opacity: 1; }
      100% { top: 6%; opacity: 0.8; }
    }
    .laser-line {
      position: absolute;
      left: 6%;
      right: 6%;
      height: 3px;
      background: linear-gradient(90deg, transparent, #38bdf8, #facc15, #38bdf8, transparent);
      box-shadow: 0 0 15px #38bdf8, 0 0 8px #facc15;
      animation: scanLine 2.2s ease-in-out infinite;
      pointer-events: none;
      z-index: 20;
    }

    #reader video {
      object-fit: cover !important;
      border-radius: 1.5rem;
    }
  </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col justify-between selection:bg-amber-400 selection:text-black">

  <!-- TOP APP BAR -->
  <header class="bg-slate-900/80 backdrop-blur-xl border-b border-white/10 px-4 py-3 sticky top-0 z-30">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-amber-400 flex items-center justify-center text-white shadow-md shadow-blue-500/30">
          <i data-lucide="qr-code" class="w-4 h-4 text-white"></i>
        </div>
        <div>
          <h1 class="font-bebas text-xl text-white tracking-wider leading-none">
            GGEN <span class="text-blue-400">2027</span> PASS SCANNER
          </h1>
          <p class="text-[9px] font-mono-code text-slate-400 uppercase tracking-widest leading-none mt-0.5">
            JIA CMNV CHECK-IN DESK
          </p>
        </div>
      </div>

      <!-- Live Counter Badge -->
      <button onclick="fetchStats()" class="bg-white/5 border border-white/10 hover:border-amber-400/50 px-3 py-1.5 rounded-xl flex items-center gap-2 transition active:scale-95">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <div class="text-left leading-none font-mono-code">
          <span id="counterText" class="text-xs font-bold text-amber-300">-- / --</span>
          <span class="block text-[8px] text-slate-400 uppercase tracking-wider">Admitted</span>
        </div>
      </button>
    </div>
  </header>

  <!-- MAIN SCANNER CONTAINER -->
  <main class="max-w-md mx-auto w-full p-4 flex-1 flex flex-col justify-center">

    <!-- CAMERA VIEWFINDER FRAME -->
    <div class="relative bg-slate-950 rounded-3xl p-3 border border-white/10 shadow-2xl overflow-hidden mb-4">
      
      <!-- Reticle corner borders -->
      <div class="absolute top-5 left-5 w-7 h-7 border-t-2 border-l-2 border-amber-400 z-20 rounded-tl-lg pointer-events-none"></div>
      <div class="absolute top-5 right-5 w-7 h-7 border-t-2 border-r-2 border-amber-400 z-20 rounded-tr-lg pointer-events-none"></div>
      <div class="absolute bottom-5 left-5 w-7 h-7 border-b-2 border-l-2 border-amber-400 z-20 rounded-bl-lg pointer-events-none"></div>
      <div class="absolute bottom-5 right-5 w-7 h-7 border-b-2 border-r-2 border-amber-400 z-20 rounded-br-lg pointer-events-none"></div>

      <!-- Laser Scanner Line -->
      <div id="laser" class="laser-line"></div>

      <!-- Video Feed Container -->
      <div id="reader" class="w-full aspect-square bg-slate-900 rounded-2xl overflow-hidden flex items-center justify-center relative">
        <div id="cameraLoadingText" class="text-xs font-mono-code text-slate-500 text-center p-4">
          <i data-lucide="camera" class="w-8 h-8 text-slate-600 mx-auto mb-2 animate-bounce"></i>
          Requesting camera permissions...
        </div>
      </div>

      <!-- Camera Selector & Controls -->
      <div class="mt-3 flex items-center gap-2">
        <select id="cameraSelect" onchange="switchCamera(this.value)" class="flex-1 bg-slate-900 border border-white/10 rounded-xl px-3 py-2 text-xs font-mono-code text-slate-300 focus:outline-none focus:border-amber-400">
          <option value="">Loading cameras...</option>
        </select>

        <button type="button" onclick="toggleTorch()" id="torchBtn" class="hidden bg-white/5 hover:bg-white/10 border border-white/10 text-slate-300 p-2 rounded-xl transition active:scale-95">
          <i data-lucide="flashlight" class="w-4 h-4 text-amber-300"></i>
        </button>
      </div>
    </div>

    <!-- MANUAL LOOKUP ACCORDION (For Cracked Screens / Low Battery) -->
    <div class="bg-slate-900/60 border border-white/10 rounded-2xl p-3 backdrop-blur-md">
      <details class="group">
        <summary class="flex justify-between items-center cursor-pointer list-none text-xs font-mono-code font-bold text-slate-300">
          <span class="flex items-center gap-2">
            <i data-lucide="keyboard" class="w-4 h-4 text-blue-400"></i>
            <span>MANUAL PASS LOOKUP</span>
          </span>
          <i data-lucide="chevron-down" class="w-4 h-4 text-slate-500 transition-transform group-open:rotate-180"></i>
        </summary>

        <form onsubmit="handleManualSearch(event)" class="mt-3 pt-3 border-t border-white/5 flex gap-2">
          <input type="text" id="manualCode" placeholder="e.g. EMPOWERED-0001" required
            class="flex-1 bg-slate-800/80 border border-white/10 rounded-xl px-3 py-2 text-sm text-white font-mono-code uppercase placeholder:text-slate-500 focus:outline-none focus:border-amber-400 transition" />
          <button type="submit" class="bg-gradient-to-r from-amber-400 to-yellow-500 text-slate-950 font-bold px-4 py-2 rounded-xl text-xs uppercase tracking-wider active:scale-95 transition">
            Check
          </button>
        </form>
      </details>
    </div>

  </main>

  <!-- FOOTER BRANDING -->
  <footer class="text-center py-3 text-[10px] font-mono-code text-slate-500 border-t border-white/5">
    Hope of Life Christian Ministries • Acts 1:8
  </footer>

  <!-- ======================================================== -->
  <!-- FULLSCREEN VERIFICATION MODAL                            -->
  <!-- ======================================================== -->
  <div id="resultModal" class="fixed inset-0 bg-black/85 backdrop-blur-xl z-50 hidden flex items-center justify-center p-4">
    <div id="modalContent" class="w-full max-w-sm rounded-3xl p-6 border text-center shadow-2xl transform transition-all duration-300 scale-95 opacity-0">
      
      <div id="modalIconContainer" class="w-16 h-16 rounded-2xl mx-auto flex items-center justify-center mb-3 shadow-lg"></div>

      <div id="modalBadge" class="inline-block text-[10px] font-mono-code font-bold uppercase tracking-widest px-3 py-1 rounded-full mb-2"></div>
      
      <h2 id="modalTitle" class="font-bebas text-3xl tracking-wide text-white leading-tight"></h2>
      
      <div id="modalDetails" class="my-4 bg-black/40 border border-white/10 rounded-2xl p-4 text-left font-mono-code text-xs space-y-1.5"></div>

      <button type="button" onclick="closeModal()" id="modalBtn" class="w-full py-3 rounded-xl font-bebas text-2xl tracking-wider uppercase transition active:scale-95 flex items-center justify-center gap-2">
        <span>SCAN NEXT DELEGATE</span>
        <i data-lucide="arrow-right" class="w-5 h-5"></i>
      </button>

      <div class="mt-3 text-[10px] font-mono-code text-slate-400" id="autoResumeNotice">
        Auto-resuming in <span id="countdownSecs">3</span>s...
      </div>
    </div>
  </div>

  <script>
    // ==============================================================
    // CONFIGURATION: PASTE YOUR DEPLOYED APPS SCRIPT URL HERE
    // ==============================================================
    const APPS_SCRIPT_API_URL = "https://script.google.com/macros/s/AKfycbxOB6MC6oCHNcOEMwf2KC8eTfhFED6WvRr5jnjL4yi50nRvmADrTi2TWapH3Q8ozg88Fw/exec";

    lucide.createIcons();

    let html5QrCode = null;
    let isProcessing = false;
    let currentCameraId = null;
    let autoCloseTimer = null;
    let countdownInterval = null;

    // Web Audio Synthesizer Beeps (Works 100% offline, zero audio files needed)
    function playBeep(type = 'success') {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'success') {
          // Cheerful two-tone chord
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5
          osc.frequency.setValueAtTime(880.00, audioCtx.currentTime + 0.1); // A5
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.35);
          if (navigator.vibrate) navigator.vibrate([80, 50, 80]);
        } else {
          // Warning/Error low buzzing tone
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(180, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.45);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.45);
          if (navigator.vibrate) navigator.vibrate([300]);
        }
      } catch (e) {}
    }

    // Initialize Cameras
    async function initCamera() {
      try {
        const devices = await Html5Qrcode.getCameras();
        const select = document.getElementById("cameraSelect");
        select.innerHTML = "";

        if (devices && devices.length > 0) {
          // Prefer back environment camera
          let backCamera = devices.find(d => d.label.toLowerCase().includes('back') || d.label.toLowerCase().includes('rear'));
          currentCameraId = backCamera ? backCamera.id : devices[0].id;

          devices.forEach(device => {
            const opt = document.createElement("option");
            opt.value = device.id;
            opt.text = device.label || `Camera ${select.length + 1}`;
            if (device.id === currentCameraId) opt.selected = true;
            select.appendChild(opt);
          });

          startScanner(currentCameraId);
        } else {
          document.getElementById("cameraLoadingText").innerText = "No camera found on this device.";
        }
      } catch (err) {
        document.getElementById("cameraLoadingText").innerText = "Camera permission denied or camera unavailable.";
      }
    }

    function startScanner(cameraId) {
      if (html5QrCode) {
        html5QrCode.stop().then(() => startScannerInstance(cameraId)).catch(() => startScannerInstance(cameraId));
      } else {
        startScannerInstance(cameraId);
      }
    }

    function startScannerInstance(cameraId) {
      html5QrCode = new Html5Qrcode("reader");
      const config = {
        fps: 15,
        qrbox: { width: 250, height: 250 },
        aspectRatio: 1.0
      };

      html5QrCode.start(cameraId, config, onScanSuccess, () => {});
      document.getElementById("cameraLoadingText").classList.add("hidden");
    }

    function switchCamera(newCameraId) {
      if (newCameraId && newCameraId !== currentCameraId) {
        currentCameraId = newCameraId;
        startScanner(newCameraId);
      }
    }

    // Process Scanned Code
    async function onScanSuccess(decodedText) {
      if (isProcessing) return;
      isProcessing = true;
      document.getElementById("laser").style.display = "none";

      await processPassVerification(decodedText);
    }

    // Manual Form Submission
    async function handleManualSearch(e) {
      e.preventDefault();
      const code = document.getElementById("manualCode").value.trim();
      if (!code || isProcessing) return;
      isProcessing = true;
      await processPassVerification(code);
    }

    // Send code to Apps Script Check-in Endpoint
    async function processPassVerification(code) {
      // Demo preview fallback if URL not set
      if (!APPS_SCRIPT_API_URL || APPS_SCRIPT_API_URL.includes("YOUR_APPS_SCRIPT_WEB_APP_URL_HERE")) {
        playBeep('success');
        showModal('success', {
          title: "PREVIEW MODE: VERIFIED",
          badge: "ADMISSION CONFIRMED",
          name: "Lawrence Justine Maqui",
          church: "Hope of Life Christian Ministries",
          passId: "EMPOWERED-0001",
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        });
        return;
      }

      try {
        const response = await fetch(APPS_SCRIPT_API_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: 'checkIn',
            query: code
          })
        });

        const result = await response.json();

        if (result.success) {
          playBeep('success');
          showModal('success', {
            title: "DELEGATE ADMITTED",
            badge: "ENTRY VERIFIED ● PASS ACTIVE",
            name: result.delegate.name,
            church: result.delegate.church,
            passId: result.delegate.passId,
            time: result.delegate.checkInTime
          });
          fetchStats(); // Update live counter
        } else if (result.errorType === 'ALREADY_CHECKED_IN') {
          playBeep('error');
          showModal('warning', {
            title: "ALREADY CHECKED IN",
            badge: "DUPLICATE ENTRY DETECTED",
            name: result.delegate.name,
            church: result.delegate.church,
            passId: result.delegate.passId,
            time: result.message
          });
        } else {
          playBeep('error');
          showModal('error', {
            title: "PASS INVALID / DECLINED",
            badge: "ACCESS DENIED",
            name: "Unknown Delegate",
            church: "N/A",
            passId: code,
            time: result.message
          });
        }
      } catch (err) {
        playBeep('error');
        showModal('error', {
          title: "CONNECTION ERROR",
          badge: "NETWORK OFFLINE",
          name: "Scan Failed",
          church: "Server Unreachable",
          passId: code,
          time: "Check Wi-Fi or mobile data."
        });
      }
    }

    // Modal Display Handler
    function showModal(type, data) {
      const modal = document.getElementById("resultModal");
      const content = document.getElementById("modalContent");
      const iconBox = document.getElementById("modalIconContainer");
      const badge = document.getElementById("modalBadge");
      const title = document.getElementById("modalTitle");
      const details = document.getElementById("modalDetails");
      const btn = document.getElementById("modalBtn");

      if (type === 'success') {
        content.className = "w-full max-w-sm rounded-3xl p-6 border border-emerald-500/50 bg-gradient-to-b from-slate-900 to-emerald-950/60 text-center shadow-[0_0_50px_rgba(16,185,129,0.35)]";
        iconBox.className = "w-16 h-16 rounded-2xl mx-auto flex items-center justify-center mb-3 bg-emerald-500 text-slate-950 shadow-lg shadow-emerald-500/50";
        iconBox.innerHTML = '<i data-lucide="check" class="w-9 h-9 stroke-[3]"></i>';
        badge.className = "inline-block text-[10px] font-mono-code font-bold uppercase tracking-widest px-3 py-1 rounded-full mb-2 bg-emerald-500/20 text-emerald-300 border border-emerald-400/40";
        badge.innerText = data.badge;
        title.innerText = data.title;
        btn.className = "w-full py-3 rounded-xl font-bebas text-2xl tracking-wider uppercase transition active:scale-95 flex items-center justify-center gap-2 bg-emerald-400 hover:bg-emerald-300 text-slate-950 font-black shadow-lg shadow-emerald-400/20";
      } else if (type === 'warning') {
        content.className = "w-full max-w-sm rounded-3xl p-6 border border-amber-500/50 bg-gradient-to-b from-slate-900 to-amber-950/60 text-center shadow-[0_0_50px_rgba(245,158,11,0.35)]";
        iconBox.className = "w-16 h-16 rounded-2xl mx-auto flex items-center justify-center mb-3 bg-amber-400 text-slate-950 shadow-lg shadow-amber-400/50";
        iconBox.innerHTML = '<i data-lucide="alert-triangle" class="w-9 h-9 stroke-[2.5]"></i>';
        badge.className = "inline-block text-[10px] font-mono-code font-bold uppercase tracking-widest px-3 py-1 rounded-full mb-2 bg-amber-500/20 text-amber-300 border border-amber-400/40";
        badge.innerText = data.badge;
        title.innerText = data.title;
        btn.className = "w-full py-3 rounded-xl font-bebas text-2xl tracking-wider uppercase transition active:scale-95 flex items-center justify-center gap-2 bg-amber-400 hover:bg-amber-300 text-slate-950 font-black shadow-lg shadow-amber-400/20";
      } else {
        content.className = "w-full max-w-sm rounded-3xl p-6 border border-rose-500/50 bg-gradient-to-b from-slate-900 to-rose-950/60 text-center shadow-[0_0_50px_rgba(244,63,94,0.35)]";
        iconBox.className = "w-16 h-16 rounded-2xl mx-auto flex items-center justify-center mb-3 bg-rose-500 text-white shadow-lg shadow-rose-500/50";
        iconBox.innerHTML = '<i data-lucide="x" class="w-9 h-9 stroke-[3]"></i>';
        badge.className = "inline-block text-[10px] font-mono-code font-bold uppercase tracking-widest px-3 py-1 rounded-full mb-2 bg-rose-500/20 text-rose-300 border border-rose-400/40";
        badge.innerText = data.badge;
        title.innerText = data.title;
        btn.className = "w-full py-3 rounded-xl font-bebas text-2xl tracking-wider uppercase transition active:scale-95 flex items-center justify-center gap-2 bg-rose-500 hover:bg-rose-400 text-white font-black";
      }

      details.innerHTML = `
        <div class="flex justify-between border-b border-white/5 pb-1"><span class="text-slate-400">PASS ID:</span><strong class="text-amber-400 font-bold">${data.passId || 'N/A'}</strong></div>
        <div class="flex justify-between border-b border-white/5 py-1"><span class="text-slate-400">NAME:</span><strong class="text-white font-bold">${data.name}</strong></div>
        <div class="flex justify-between border-b border-white/5 py-1"><span class="text-slate-400">CHURCH:</span><span class="text-blue-300 font-semibold">${data.church}</span></div>
        <div class="flex justify-between pt-1"><span class="text-slate-400">INFO:</span><span class="text-slate-300">${data.time}</span></div>
      `;

      lucide.createIcons();

      modal.classList.remove("hidden");
      setTimeout(() => {
        content.classList.remove("scale-95", "opacity-0");
        content.classList.add("scale-100", "opacity-100");
      }, 20);

      // Auto-resume countdown
      let remaining = 3;
      document.getElementById("countdownSecs").innerText = remaining;
      clearInterval(countdownInterval);
      clearTimeout(autoCloseTimer);

      countdownInterval = setInterval(() => {
        remaining--;
        if (remaining >= 0) document.getElementById("countdownSecs").innerText = remaining;
      }, 1000);

      autoCloseTimer = setTimeout(() => {
        closeModal();
      }, 3500);
    }

    function closeModal() {
      clearInterval(countdownInterval);
      clearTimeout(autoCloseTimer);
      const modal = document.getElementById("resultModal");
      const content = document.getElementById("modalContent");
      
      content.classList.remove("scale-100", "opacity-100");
      content.classList.add("scale-95", "opacity-0");

      setTimeout(() => {
        modal.classList.add("hidden");
        document.getElementById("laser").style.display = "block";
        document.getElementById("manualCode").value = "";
        isProcessing = false;
      }, 200);
    }

    async function fetchStats() {
      if (!APPS_SCRIPT_API_URL || APPS_SCRIPT_API_URL.includes("YOUR_APPS_SCRIPT_WEB_APP_URL_HERE")) return;
      try {
        const res = await fetch(APPS_SCRIPT_API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'getScannerStats' })
        });
        const data = await res.json();
        if (data.success) {
          document.getElementById("counterText").innerText = `${data.checkedIn} / ${data.totalApproved}`;
        }
      } catch (e) {}
    }

    document.addEventListener("DOMContentLoaded", () => {
      initCamera();
      fetchStats();
    });
  </script>
</body>
</html>
